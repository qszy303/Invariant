[project]
name = "proof"
version = "0.1.0"
description = "Invariant checker for spreadsheet financial models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openpyxl",
    "anthropic",
    "streamlit",
]

[project.scripts]
proof = "proof.cli:main"

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "hypothesis>=6.170.15",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proof", "synth", "eval", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
